[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
markers =
    unit: fast unit tests with mocked Supabase
    integration: slow integration tests using the live Supabase database
filterwarnings =
    ignore:The 'timeout' parameter is deprecated. Please configure it in the http client instead.:DeprecationWarning:supabase\._sync\.client
    ignore:The 'verify' parameter is deprecated. Please configure it in the http client instead.:DeprecationWarning:supabase\._sync\.client
